name: lunarlab

services:
  app:
    image: lunarlab:local
    build: .
    container_name: lunarlab
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017/nd3_db
      INCOMING_DIR: /app/incoming
      PROCESSED_DIR: /app/watch/processed
      ND3_BINARY: /app/not-configured/nd3
      CALIBRATION: /app/not-configured/calibration.json
      NODE_ENV: development
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - lunarlab_node_modules:/app/node_modules
      - ./incoming:/app/incoming
      - ./watch:/app/watch
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8.0.32-noble
    container_name: lunarlab-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - lunarlab_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  lunarlab_node_modules:
  lunarlab_mongo_data:
